[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odracir"
version = "2.0.0"
description = "Deterministic scientific paper-study extraction contracts and pipeline"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "PyMuPDF>=1.24",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
odracir = "odracir.cli:main"
odracir-v2 = "odracir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
