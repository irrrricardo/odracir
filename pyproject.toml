[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odracir"
version = "0.3.1"
description = "A modular DeepSeek API based research agentic system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.100.0",
  "pymupdf>=1.24.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
docling = [
  "docling>=2.0.0",
]
pymupdf4llm = [
  "pymupdf4llm>=1.27.2.3,<2",
]
ocr = [
  "ocrmypdf>=16.0.0",
]

[project.scripts]
odracir = "odracir.cli:main"
odracir-sync-docs = "odracir.docs_sync:main"

[tool.setuptools.packages.find]
where = ["src"]
